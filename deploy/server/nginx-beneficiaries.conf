# /etc/nginx/sites-available/beneficiaries  (ثم رابط في sites-enabled)
# server مستقل للنطاق الفرعي؛ لا يغيّر إعداد den-op-ph.ly الموجود.
# الشهادة: sudo certbot --nginx -d beneficiaries.den-op-ph.ly  (يضيف أسطر 443 تلقائيًا)
server {
    listen 80;
    listen [::]:80;
    server_name beneficiaries.den-op-ph.ly;

    client_max_body_size 12m;   # رفع صورة المستفيد حتى 10 ميغابايت

    location / {
        proxy_pass http://127.0.0.1:3102;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
}
