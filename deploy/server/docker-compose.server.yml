# منظومة المستفيدين على سيرفر الوحدة، بجانب wahda_app دون أي مشاركة معه:
# لا PostgreSQL ولا Redis ولا الشبكة waadapp_tba_network. البيانات SQLite في ./data والصور في ./storage.
services:
  beneficiaries:
    build:
      context: ../..
    image: beneficiaries:latest
    container_name: beneficiaries
    restart: unless-stopped
    ports:
      - "127.0.0.1:3102:3000"     # Nginx فقط يصل إليه (wahda_app على 3101)
    environment:
      SESSION_SECRET: ${SESSION_SECRET:?اكتب SESSION_SECRET في ملف .env}
      COOKIE_SECURE: "true"
    volumes:
      - /opt/beneficiaries-data/data:/data
      - /opt/beneficiaries-data/storage:/storage
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
